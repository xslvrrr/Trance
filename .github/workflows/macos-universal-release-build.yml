name: macOS Release Build

on:
  workflow_call:
    inputs:
      build-version:
        description: "The version to build"
        required: true
        type: string

jobs:
  mac-build:
    name: Unify macOS (Universal)
    runs-on: "macos-26"

    strategy:
      fail-fast: false

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          token: ${{ secrets.DEPLOY_KEY }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: ".nvmrc"

      - name: Setup Python
        uses: actions/setup-python@v5
        # note: This will use the version defined in '.python-version' by default

      - name: Setup Git
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

      - name: Install system dependencies
        run: |
          brew update
          brew install cairo gnu-tar mercurial
          sudo pip install setuptools

          brew uninstall --ignore-dependencies python3.12 -f

          export PATH="$(python3 -m site --user-base)/bin":$PATH
          python3 -m pip install --user mercurial

          rm '/usr/local/bin/2to3-3.11' '/usr/local/bin/2to3-3.12' '/usr/local/bin/2to3'
          rm '/usr/local/bin/idle3.11' '/usr/local/bin/idle3.12' '/usr/local/bin/idle3'
          rm '/usr/local/bin/pydoc3.11' '/usr/local/bin/pydoc3.12' '/usr/local/bin/pydoc3'
          rm '/usr/local/bin/python3.11' '/usr/local/bin/python3.12' '/usr/local/bin/python3'
          rm '/usr/local/bin/python3.11-config' '/usr/local/bin/python3.12-config' '/usr/local/bin/python3-config'

          brew install watchman

          cargo install apple-codesign --locked --force

      - name: Force usage of gnu-tar
        run: |
          echo 'export PATH="/usr/local/opt/gnu-tar/libexec/gnubin:$PATH"' >> ~/.bash_profile
          echo 'export PATH="/usr/local/opt/gnu-tar/libexec/gnubin:$PATH"' >> ~/.zsh
          source ~/.bash_profile

      - name: Install dependencies
        run: |
          npm ci

      - name: Load surfer CI setup
        run: npm run surfer -- ci --brand trance --display-version ${{ inputs.build-version }}

      - name: Download Firefox source and dependencies
        run: npm run download

      - name: Bootstrap
        run: |
          cd engine
          export SURFER_PLATFORM="darwin"
          export PATH="$(python3 -m site --user-base)/bin":$PATH
          ./mach --no-interactive bootstrap --application-choice browser --no-system-changes || true
          cd ..

      - name: Import
        run: npm run import

      - name: Populate mozconfig
        env:
          SURFER_MOZCONFIG_ONLY: true
          ZEN_RELEASE: 1
          ZEN_GA_DISABLE_PGO: true
        run: |
          npm run build
          cd engine
          ./mach configure

      - name: Build host mar tool
        run: |
          set -ex
          cd engine
          echo "ac_add_options --enable-project=tools/update-packaging" > mar-mozconfig
          echo "mk_add_options MOZ_OBJDIR=@TOPSRCDIR@/obj-mar-tools" >> mar-mozconfig
          MOZCONFIG=$PWD/mar-mozconfig ./mach build -v
          cp obj-mar-tools/dist/host/bin/mar ../trance-macos-host-mar
          rm -rf obj-mar-tools mar-mozconfig

      - name: Download x86_64 DMG from artifacts
        uses: actions/download-artifact@v4
        with:
          name: trance-x86_64-apple-darwin-dist.dmg

      - name: Download aarch64 DMG from artifacts
        uses: actions/download-artifact@v4
        with:
          name: trance-aarch64-apple-darwin-dist.dmg

      - name: Remove any existing .app folders
        run: |
          set -x
          cd engine
          rm -rf "./obj-x86_64-apple-darwin/" || true
          rm -rf "./obj-aarch64-apple-darwin/" || true

      - name: Extract .app from dmg
        run: |
          set -ex
          cd engine
          echo "Extracting x86_64 .app from dmg"
          mkdir -p ./obj-x86_64-apple-darwin/dist
          mkdir -p ./obj-aarch64-apple-darwin/dist
          ./mach python -m mozbuild.action.unpack_dmg \
            ../trance-x86_64-apple-darwin-dist.dmg \
            ./obj-x86_64-apple-darwin/dist
          echo "Extracting aarch64 .app from dmg"
          ./mach python -m mozbuild.action.unpack_dmg \
            ../trance-aarch64-apple-darwin-dist.dmg \
            ./obj-aarch64-apple-darwin/dist

      - name: Set Trance app bundle name
        run: |
          cd engine/obj-x86_64-apple-darwin/dist
          export APP_NAME=Trance
          export APP_BUNDLE=Trance.app
          echo "APP_NAME=$APP_NAME" >> $GITHUB_ENV
          echo "APP_BUNDLE=$APP_BUNDLE" >> $GITHUB_ENV
          echo "APP_NAME=$APP_NAME"

      - name: List .app folders
        run: |
          ls engine/
          echo "--------------------"
          cd engine/obj-x86_64-apple-darwin/dist
          find . -maxdepth 1 -name "*.app" -type d
          cd ../..

      - name: Unify architectures
        run: |
          cd engine
          ./mach python "./toolkit/mozapps/installer/unify.py" "./obj-x86_64-apple-darwin/dist/${{ env.APP_BUNDLE }}" "./obj-aarch64-apple-darwin/dist/${{ env.APP_BUNDLE }}"
          echo "Merged aaarch64 into x86_64!"
      - name: Ad-hoc sign app
        run: |
          # Trance has no Apple certificates; release artifacts are ad-hoc signed only.
          codesign --force --deep --sign - "engine/obj-x86_64-apple-darwin/dist/${{ env.APP_BUNDLE }}"


      - name: Create DMG
        run: |
          cd engine
          ./mach python -m mozbuild.action.make_dmg \
            --volume-name "${{ env.APP_NAME }}" \
            --background ../configs/branding/trance/background.png \
            --icon ../configs/branding/trance/firefox.icns \
            --dsstore ../configs/branding/trance/dsstore \
            ./obj-x86_64-apple-darwin/dist/ ../trance-macOS-universal-temp.dmg
      - name: Create unsigned release DMG
        run: |
          # No Apple certificates are available, so Trance is not notarised.
          hdiutil convert trance-macOS-universal-temp.dmg -format UDZO -imagekey zlib-level=9 -o trance.macos-universal.dmg



      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          retention-days: 5
          name: trance.macos-universal.dmg
          path: ./trance.macos-universal.dmg

      - name: Download platform.ini
        uses: actions/download-artifact@v4
        with:
          name: platform.ini

      - name: Package for mar
        env:
          JUST_MAR: true
          ZEN_GA_DISABLE_PGO: true
        run: |
          # we don't need it anymore
          set -ex
          rm -rf ./engine/obj-aarch64-apple-darwin
          mkdir -p ./engine/obj-x86_64-apple-darwin/dist/bin
          mv ./platform.ini ./engine/obj-x86_64-apple-darwin/dist/bin/platform.ini
          export SURFER_PLATFORM="darwin"
          export ZEN_RELEASE=1
          # full path to trance-macos-host-mar
          export MAR=$(pwd)/trance-macos-host-mar
          chmod +x $MAR
          echo "MAR=$MAR"
          npm run package -- --verbose
          mv ./dist/output.mar ./macos.mar

      - name: Upload build artifact (.mar)
        uses: actions/upload-artifact@v4
        with:
          retention-days: 5
          name: macos.mar
          path: ./macos.mar

      - name: Upload build artifact (update manifests)
        uses: actions/upload-artifact@v4
        with:
          retention-days: 5
          name: macos_update_manifest
          path: ./dist/update
