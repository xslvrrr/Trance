#
# Trance: the theme picker.
#
# The cluster is one mod (3), and it is a mod that extends a Zen feature rather
# than replacing one — which is what Trance does here too. `TranceTheme` appends
# its controls to Zen's existing gradient panel and wraps five methods on
# `gZenThemePicker`; Zen keeps owning the dots, the harmonies and the saving
# (ADR-031).
#
# There is deliberately **no** `trance.theme.translucency` pref, and no Trance
# translucency slider. Zen's picker already has one — and since 0.2.0 it means
# only one thing: tint strength. `currentOpacity` used to reach the CSS as the
# alpha of every wheel colour, so that slider was simultaneously the tint
# control and the transparency control, and asking for either meant giving up
# the other. `TranceTheme` now composites that alpha down against the browser's
# own chrome colour, so 0 is the neutral chrome and 1 is the colour at full
# strength, both opaque.
#
# Transparency is `trance.surface.opacity` and blur is
# `trance.surface.blur.radius` — one surface for the whole browser (ADR-041),
# which is why they are prefs and not theme fields. `trance.theme.controls.master`
# below puts both in the picker as well, where the look is actually decided.
# A second *surface* for one pref, not a second owner of the value.
#
# Per-space values — lightness, gradient angle and the selected palette — are
# not prefs. They belong to the space, exactly like its colours do, so they are
# three extra fields on the theme object Zen already saves. A pref would be one
# global value for all spaces, and a pref per space would be an unbounded set
# that TRANCE.md §6.6 could not surface.
#
# Refs: TRANCE.md §3.1, §6.6, §8.1, §13 Phase 8; ADR-031;
# docs/trance/mods/better-zen-gradient-picker.md

# === Mark: Master switch ===

- name: trance.theme.enabled
  value: true

# === Mark: Controls ===

# The lightness slider.
#
# Zen derives lightness from how far the dot is from the centre of the wheel, so
# "this hue, but darker" means moving the dot somewhere it is no longer the hue
# you wanted. While a lightness is set, Trance owns it and the wheel is hue and
# saturation only; the "Full colour" palette hands it straight back.
- name: trance.theme.controls.lightness
  value: true

# The gradient-angle knob. Inert while the theme is a single flat colour,
# because a flat colour has no angle — Zen hard-codes -45 degrees for every
# gradient it builds, and this is the control for that number.
- name: trance.theme.controls.angle
  value: true

# The two master controls in the picker: a surface-opacity slider and a
# frost-blur knob, in a row under the lightness slider and the angle knob.
#
# One pref for both, because they are one idea — the surface the whole browser
# shares, reachable from the panel where the rest of the look is decided.
# Splitting one decision into per-part switches is what ADR-041 removed.
#
# They write `trance.surface.opacity` and `trance.surface.blur.radius`, which
# the settings page has always had; the picker is the second surface for the
# same two values, and each reads itself back through a pref observer so the two
# cannot disagree while both are open.
#
# The blur knob goes inert where `--trance-surface-blur` has no consumer —
# where the *window* is translucent in its own right, the frost is produced
# behind Gecko at a radius the operating system owns. It says so in its tooltip
# rather than pretending, and turning `trance.surface.transparency` off hands
# the blur back. See the Blur section of trance-surfaces.css.
- name: trance.theme.controls.master
  value: true

# The exact-colour row: type a hex code and it is used verbatim, rather than
# being derived from a position on the wheel.
#
# It is a front-end for Zen's own custom-colour path, not a second one — which
# is why turning this on also turns on Zen's `show-custom-colors`, borrowed
# while the feature is enabled and given back when it is not. Without it the
# list that *removes* an exact colour is hidden, and hex entry would be one-way.
- name: trance.theme.controls.hex
  value: true

# === Mark: Palettes and saved themes ===

# The palette button. A palette is a slider configuration — a saturation and a
# lightness target, and sometimes a translucency — not a set of colours, because
# the colours in this picker come from where you click.
- name: trance.theme.palettes.enabled
  value: true

# The heart, and the pages of saved themes at the start of the pager (eight to
# a page).
#
# The pager opens on the first saved page, and "next" from the last saved page
# lands on Zen's first preset page. Trance only prepends pages, and moves Zen's
# private page index only through Zen's own arrow handlers, so the index and the
# scroll position agree and both arrows work.
- name: trance.theme.saved.enabled
  value: true

# The saved themes themselves, as JSON. State rather than a setting, and the
# only Trance pref that is one.
#
# It is here rather than in a file because it is small, because it has to be
# readable from every window at once, and because the alternative — a file — is
# a second storage mechanism for one list. TRANCE.md §6.6 says every trance.*
# pref appears on the settings page, and this one does: as a count, with a
# button that empties it.
#
# The default is the empty string, not "[]", and that is ffprefs rather than a
# preference: it quotes a value only when the value contains a letter, a dot, a
# space or a quote, so "[]" is emitted bare and `pref("…", [])` is not
# JavaScript. Empty reads as "nothing saved" on both sides.
- name: trance.theme.saved.themes
  value: ""

# === Mark: Notifications ===

# The in-panel message that names what a button just did: which palette was
# selected, which colour harmony the algorithm button moved to, whether a theme
# was saved or forgotten.
#
# It costs no timer. The whole life of a message is one Web Animation whose
# duration is `--trance-toast-life`, so at motion level 0 there is no animation
# and no timeout — the message stays until the next one replaces it.
- name: trance.theme.notifications
  value: true
