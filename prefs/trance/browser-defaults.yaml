#
# Trance: browser defaults that are not `trance.*` prefs.
#
# Everything here is a Firefox or Zen preference whose *default value* Trance
# disagrees with. None of them is declared anywhere else in `prefs/`, which is
# the condition for this file existing at all: ffprefs sorts every entry by pref
# name and emits duplicates adjacently, so a second definition of a name that is
# already declared resolves in `fs::read_dir` order — a different browser on a
# different machine (see the note on `zen.view.enable-loading-indicator` in
# TranceFeedback.mjs). A default Trance wants to change that Zen or Firefox
# already declares has to be changed in the file that declares it, and is an
# upstream touchpoint; one that nobody declares belongs here, where it costs
# nothing to rebase.
#
# These are *defaults*, not locks. Every one of them is a setting with a control
# in about:preferences, and a user who changes it wins for the rest of the
# profile's life.
#
# Refs: TRANCE.md §5.5, §6.6

# === Mark: History ===

# "Remember history", rather than the custom-settings state a fresh profile can
# land in.
#
# The privacy pane's dropdown is not one pref: it reads `privacy.history.custom`
# to decide whether to say "Remember history" or "Use custom settings", and the
# behaviour behind it comes from the three below. Setting only one of them
# produces a browser that remembers history and says it does not, or the reverse.
- name: privacy.history.custom
  value: false

- name: places.history.enabled
  value: true

- name: browser.privatebrowsing.autostart
  value: false
