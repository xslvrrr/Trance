#
# Trance: the first-run onboarding flow.
#
# Trance replaces Zen's welcome flow rather than running after it. The two
# cannot both own the first window — Zen's is a full-window takeover that hides
# every child of `#browser` and restores them in `finish()` — and Trance has
# three decisions to take before Zen's five, all of which change how the browser
# is built rather than how it looks (ADR-051).
#
# The three Trance pages, in order, and what each one actually writes:
#
#
#   1. Mod manager         `trance.mods.channel`, and the newest engine on that
#                          channel, installed into `{profile}/chrome/JS` when
#                          the page is committed (unless it is already there).
#   2. Architecture        `trance.perf.arch`, then the surface prefs whose cost
#                          is GPU blur — the one Trance setting where an Intel
#                          Mac and an Apple Silicon Mac want different numbers.
#   3. Edgeless            `trance.surface.edgeless`.
#
# Then Zen's own five: import, search engine, essentials, workspace colours and
# a finish page, rebuilt against Zen's `browser/zen-welcome.ftl` so they stay
# translated in every locale Zen ships.
#
# Refs: TRANCE.md §9, §13 Phase 13; ADR-051

# === Mark: Master switch ===

# Off, `TranceOnboarding` allocates nothing and Zen's own welcome flow runs
# instead — the `ZenStartup` touchpoint is a single `if` around the existing
# `loadSubScript` call, so turning this off restores upstream behaviour exactly
# rather than leaving a browser with no first run at all.
- name: trance.onboarding.enabled
  value: true

# State, not a setting: true once a window has taken ownership of the flow.
#
# Written when a window decides to start, not when the flow ends, for the same
# reason `trance.firstrun.completed` is: it is what stops a second window
# opening a second copy, and what stops the whole flow coming back if the
# browser is killed halfway through it.
#
# The settings page surfaces it as a button ("Run it again"), not a checkbox.
- name: trance.onboarding.completed
  value: false

# === Mark: What the flow decides ===

# Legacy preference retained for profiles that already have it. Trance ships
# one brand (ADR-006), so there is no longer a stable/twilight onboarding choice.
- name: trance.onboarding.channel
  value: "stable"

# Which channel the preinstalled mod manager follows: `cosine` (Sine's
# pre-release channel, the shipped default — ADR-018) or `sine` (stable).
#
# `scripts/trance-cosine.py --channel` decides what a *build* is provisioned
# with. Onboarding installs the chosen channel's newest engine into the profile.
# Changed later from Settings, it rewrites the version in the installed
# engine's own `engine.json` instead — the mechanism Sine uses to pick a
# channel, not a workaround for it — and the engine follows on its next update.
# Settings' "Install or refresh Sine" button is the install that happens now.
- name: trance.mods.channel
  value: "cosine"

# The CPU architecture Trance tunes its surfaces for: `arm64` or `x86_64`.
#
# Not a description of the machine — Gecko already knows that, and the flow
# fills this in from `Services.appinfo.XPCOMABI` before anyone touches it. It is
# an override, for the case Gecko cannot see: a build running under Rosetta
# reports the *build's* architecture, and a user who knows they are on Apple
# Silicon should be able to say so.
#
# What it changes is blur, and only blur. Everything else Trance draws costs the
# same on both; `backdrop-filter` at a 24px radius over a full window is the one
# effect where an integrated Intel GPU and an Apple Silicon one are not in the
# same class (TRANCE.md §3.3).
#
# It sets the *defaults* of those blur prefs, never their user values: a blur a
# user set themselves is kept whatever this says. Runtime defaults are not
# saved, so `TranceOnboardingSettings` reapplies this answer at every start.
- name: trance.perf.arch
  value: "arm64"
