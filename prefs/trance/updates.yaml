#
# Trance: GitHub release detection and verified macOS DMG installation.
#
# The built-in Firefox MAR/AUS updater remains disabled by distribution policy.
# Trance verifies the release asset digest before staging and only swaps the
# app bundle after the running browser exits.
# Refs: TRANCE.md §13 Phase 12; ADR-104

- name: trance.updates.enabled
  value: true

# Include published GitHub prereleases as well as stable releases.
- name: trance.updates.prereleases
  value: true

# Release tag the user explicitly chose to skip.
- name: trance.updates.skipped
  value: ""

# Unix seconds of the last check attempt; internal scheduler state.
- name: trance.updates.last-check
  value: 0

# The verified, staged bundle waiting for the next browser shutdown.
- name: trance.updates.staged
  value: ""

# Set only by an explicit "Install and restart" action.
- name: trance.updates.restart-after-install
  value: false
