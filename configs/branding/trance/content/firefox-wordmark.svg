<!-- Trance wordmark, about:privatebrowsing. Takes its colour from
   - -moz-context-properties: fill on the consuming element. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 80 56" width="80" height="56">
  <text x="40" y="36" text-anchor="middle"
        font-family="SF Pro Display, -apple-system, system-ui, Segoe UI, Inter, Helvetica Neue, sans-serif"
        font-size="19" font-weight="600" letter-spacing="-0.6"
        fill="context-fill #20123a">Trance</text>
</svg>
